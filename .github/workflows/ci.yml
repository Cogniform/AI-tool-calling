name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (version from .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc 是唯一的类型门禁（package.json 没有 typecheck 脚本，build 也是 tsc，
      # 但 build 只在类型通过后才产文件，所以先 --noEmit 拿到清晰的错误列表）
      - name: Typecheck
        run: npx tsc --noEmit

      # 命名约定测试：24 条断言（工具名 / handler 形状 / MCP server 映射）
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 以下两步是本次新增：lint 与格式此前只在本地手动跑（package.json 里
      # 早就有 lint / format:check 脚本，workflow 里从没调用过）。
      # 版本来源仍是 package.json 的 devDependencies，由上面的 npm ci 按 lockfile 装出。
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  # 收口 job —— ruleset 的 required_status_checks 只配这一个名字（CI Success），
  # 本仓内部 job 增删时规则集无需改动。改本 job 前必读三条：
  #   1. 判定只放 step 级：放 job 级时条件为假会让本 job 变 skipped，
  #      而 GitHub 把 skipped 当 Success —— 那正好是我们要防的假绿。
  #   2. needs 必须列全本文件所有 job id；漏一个，那个 job 红了也照样放行。
  #   3. skipped 一并判红：本 workflow 没有合法的 if: 跳过，出现 skipped
  #      只可能是上游失败级联（上游同在 needs 里，会同时判红）。
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::有 job 未成功 —— CI Success 判红（原因见本 job 上方注释）"
          echo '${{ toJSON(needs) }}'
          exit 1
